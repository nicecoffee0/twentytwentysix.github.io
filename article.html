<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — YENA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="page">
    <header class="page-header">
      <a href="#" id="back-link" class="back">← BACK</a>
      <div class="article-header-right">
        <span class="page-number">ARTICLE</span>

        <div class="article-actions">
          <a id="edit-button" class="action-button" href="#">EDIT</a>
        </div>
      </div>
    </header>

    <section class="entry-preview" id="entry-preview"></section>

    <article class="article">
      <p class="page-label" id="article-category"></p>
      <h1 id="article-title"></h1>
      <div class="article-meta" id="article-meta"></div>
      <div class="article-content" id="article-content"></div>
    </article>
  </main>

  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
